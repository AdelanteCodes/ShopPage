name: Publish website with standalone creations
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdelanteCodes/PDFViewer
          ref: main
          path: pdf-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdelanteCodes/AWB-Maker
          ref: main
          path: awb-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PDF distribution before publication
        working-directory: pdf-source
        run: |
          node --test tests/*.test.mjs
          python scripts/check_browser_build.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify AWB Maker before publication
        working-directory: awb-source
        run: node --test tests/*.test.mjs
      - name: Assemble website
        shell: python
        run: |
          import json, shutil, subprocess
          from pathlib import Path
          shutil.copytree('site', '_site', ignore=shutil.ignore_patterns('.git', '.github', 'node_modules', 'test-results', '__pycache__'))
          shutil.copytree('pdf-source/pdf-viewer', '_site/pdf-viewer')
          revision = subprocess.check_output(['git', '-C', 'pdf-source', 'rev-parse', 'HEAD'], text=True).strip()
          Path('_site/pdf-viewer/source-revision.txt').write_text(revision + '\n')
          awb_root = Path('awb-source')
          for name in json.loads((awb_root / 'scripts/publish-files.json').read_text()):
              relative = Path(name)
              if relative.is_absolute() or '..' in relative.parts:
                  raise ValueError('Invalid AWB distribution path')
              target = Path('_site/awb-maker') / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(awb_root / relative, target)
          awb_revision = subprocess.check_output(['git', '-C', 'awb-source', 'rev-parse', 'HEAD'], text=True).strip()
          Path('_site/awb-maker/source-revision.txt').write_text(awb_revision + '\n')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

